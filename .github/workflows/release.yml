name: Release

# Every push to master builds the extension and publishes it as a GitHub release.
# The version is the commit's timestamp in UTC, YYYY.MM.DD.HHMM, used as the tag and release name.
on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Version from commit time
        id: version
        run: |
          version=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y.%m.%d.%H%M "$GITHUB_SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Typecheck and test
        run: npm run check

      - name: Build
        env:
          DIAGONAL_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build
          (cd dist && zip -qr "../diagonal-extension-${DIAGONAL_VERSION}.zip" .)
          # Same zip under a fixed name: releases/latest/download/diagonal-extension.zip is what the
          # Homebrew cask (iko-soy/homebrew-tap, Casks/diagonal.rb) downloads.
          cp "diagonal-extension-${DIAGONAL_VERSION}.zip" diagonal-extension.zip
          cat dist/manifest.json | head -5
          # The Chrome Web Store package: no pinned key, no bundled host (docs/store/listing.md).
          npm run zip:store

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="diagonal-extension-${VERSION}.zip"
          notes="Built from ${GITHUB_SHA::7}. Install with: brew install iko-soy/tap/diagonal. Or by hand: unzip, load the folder at brave://extensions (Developer mode → Load unpacked), then install the native host once from Terminal: bash <that folder>/install-host.command"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Two commits in the same minute share a version: refresh the asset on the existing release.
            gh release upload "$VERSION" "$asset" diagonal-extension.zip diagonal-store.zip --clobber
          else
            gh release create "$VERSION" "$asset" diagonal-extension.zip diagonal-store.zip --target "$GITHUB_SHA" --title "Diagonal $VERSION" --notes "$notes" --latest
          fi

      # Uploads the release to the Chrome Web Store and submits it for review, once the listing exists and
      # its API credentials are set as repository secrets (docs/store/listing.md). Skipped until then.
      - name: Upload to the Chrome Web Store
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CWS_EXTENSION_ID" ] || [ -z "$CWS_REFRESH_TOKEN" ]; then
            echo "Chrome Web Store secrets not set; skipping upload."
            exit 0
          fi
          token=$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          curl -fsS -X PUT -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -T diagonal-store.zip "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID" | tee upload.json
          jq -e '.uploadState == "SUCCESS"' upload.json
          curl -fsS -X POST -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish" | tee publish.json
